# ---------------------------------------------------------------------------
# Terminal capabilities
#
# Tuned for Terminal.app (TERM_PROGRAM=Apple_Terminal) on macOS, outer TERM=
# xterm-256color. Terminal.app is the primary and only terminal in use, so no
# capability is asserted beyond what it actually implements. If another
# emulator is added later, gate its extra features on a TERM value that only
# that emulator reports, not on the shared xterm-256color.
# ---------------------------------------------------------------------------

# Correct terminfo inside tmux (256 colors, italics, extended capabilities).
set -g default-terminal "tmux-256color"

# ============================================================================
# tmux Configuration for Claude Code Agent Teams
# macOS + Warp Terminal | Catppuccin Mocha + plugins
# ============================================================================

# --- Core Settings -----------------------------------------------------------

set -g default-terminal "tmux-256color"       # Enable 256 colors
set -sg escape-time 0                         # No delay after pressing Escape
set -g history-limit 50000                    # Scrollback buffer
set -g mouse on                               # Click panes, resize, scroll
set -g base-index 1                           # Windows start at 1, not 0
setw -g pane-base-index 1                     # Panes start at 1 too
set -g renumber-windows on                    # Fill gaps when windows close
set -g focus-events on                        # Pass focus events to programs

# --- Pane Behavior -----------------------------------------------------------

set -g remain-on-exit off                     # Auto-close pane when agent exits
set -g display-panes-time 2000                # Show pane numbers for 2 seconds
set -g pane-border-status top                 # Show pane labels at the top
set -g pane-border-format " #{pane_index}: #S "  # Label: pane number + session name

# Terminal title shows session name (not hostname)
set -g set-titles on
set -g set-titles-string "#S"

# --- Prefix Key: Ctrl+a (instead of default Ctrl+b) -------------------------

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Key Bindings ------------------------------------------------------------

# Config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Splitting (using current pane's directory)
bind | split-window -h -c "#{pane_current_path}"   # Side by side
bind - split-window -v -c "#{pane_current_path}"   # Top and bottom
unbind '"'
unbind %

# Navigate panes (no prefix needed — just Alt+Arrow)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes (no prefix needed — Ctrl+Alt+Arrow)
bind -n C-M-Left resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up resize-pane -U 3
bind -n C-M-Down resize-pane -D 3

# Pane management
bind x kill-pane
bind S setw synchronize-panes \; display-message "Sync #{?synchronize-panes,ON,OFF}"

# Anthropic settings
set -g allow-passthrough on


# Require confirmation explicitly before closing a pane
bind-key x confirm-before -p "kill-pane? (y/n)" kill-pane

# To navigating through output in quick way, enable vim navigation keys
set-window-option -g mode-keys vi


# Vim Style in Copy-Mode "<prefix> ["
# Interacting with Paste Buffer
bind-key Escape copy-mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection            -N "start visual mode for selection"
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel  -N "yank text into the buffer"
bind-key C-b choose-buffer # view the buffer stack
unbind-key p
bind-key p paste-buffer # default "<prefix> ]"

# Alt+C: To copy from the current buffer to the sys clipboard .
bind-key M-c run "tmux save-buffer - | xclip -i -sel clipboard"

# Alt+V: To paste text from sys clipboard into current buffer
bind-key M-v run "tmux set-buffer \"$(xclip -o -sel clipboard)\""

# Ctr+C: Make it even better -just one step to move from sys->buffer->editor vice versa
bind-key -Tcopy-mode-vi C-c send -X copy-pipe "xclip -i -sel p -f | xclip -i -sel c" \; display-message "copied to system clipboard"

# Ctr+V: To paste text from sys clipboard into the view
bind-key C-v run "tmux set-buffer \"$(xclip -o -sel clipboard)\";tmux paste-buffer"

# To take ASCII screenshots (tmux-resurrect uses C-s for saving, here binding to Alt-s ) .
# create the dir for storing screenshots
bind-key M-s run "tmux capture-pane; tmux save-buffer ~/.mytmux/pane_screenshots/\"$(date +%FT%T)\".screenshots"

# Status Bar configuration
set-option -g status-style fg=white,bg=colour04
set-option -g status-justify centre
set-window-option -g window-status-style fg=colour118,bg=colour04
set-window-option -g window-status-current-style fg=black,bold,bg=colour011
set-window-option -g window-status-last-style fg=black,bold,bg=colour011
set-window-option -g window-status-separator |

# Left Side
# Show my active session, window, pane name or id  
set-option -g status-left-length 50   # default 10
set-option -g status-left "[#[fg=white]S: #S, #[fg=colour11]W #I-#W, #[fg=colour3]P: #P #[fg=white]]"
# set-option -g status-left-style

# Right Side
set-option -g status-right-length 50   # default 50
set-option -g status-right "#[fg=grey,dim,bg=default] uptime: #(uptime | cut -f 4-5 -d\" \" | cut -f 1 -d\",\")"

# Enable Activity Alerts
set-option -g status-interval 60           # Update the status line every 60 seconds (15 is default)
set-window-option -g monitor-activity on   # highlights the window name in the status line

# Bind 'y' in copy mode to copy to macOS system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Copy text on mouse release to macOS system clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
